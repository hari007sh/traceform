openapi: 3.0.3
info:
  title: Traceform API
  description: |
    Open-source AI agent production platform API.

    Traceform replaces 5-6 separate tools with one unified platform covering
    observability (Trace), self-healing (Shield), evaluation (Test), guardrails (Guard),
    gateway routing (Route), and cost intelligence (Cost).

    ## Authentication

    All `/v1/*` endpoints accept either:
    - **JWT Bearer token** (issued via GitHub OAuth, for dashboard use)
    - **API key** (prefixed `tf_sk_...`, for SDK/programmatic use)

    All `/api/*` endpoints require a JWT Bearer token (dashboard only).

    Pass credentials via the `Authorization: Bearer <token>` header.

    ## Error Format

    All errors follow a consistent JSON structure:
    ```json
    {
      "error": {
        "code": "VALIDATION_ERROR",
        "message": "name is required"
      }
    }
    ```
  version: 1.0.0
  contact:
    name: Traceform
    url: https://traceform.dev

servers:
  - url: http://localhost:8080
    description: Local development (API server)
  - url: http://localhost:8090
    description: Gateway proxy (OpenAI-compatible)

tags:
  - name: System
    description: Health checks and readiness probes
  - name: Auth
    description: GitHub OAuth and SSO authentication
  - name: Sessions
    description: Session queries and detail views
  - name: Ingestion
    description: Trace data ingestion (sessions, spans, events)
  - name: Analytics
    description: Overview and time-series analytics
  - name: Shield
    description: Self-healing events and analytics
  - name: Agents
    description: Agent definition CRUD
  - name: Patterns
    description: Failure pattern management
  - name: Alerts
    description: Alert rule management
  - name: Sampling
    description: Sampling configuration
  - name: Test
    description: Test suites, cases, runs, and evaluators
  - name: Guard
    description: Guardrail rules, checks, and events
  - name: Cost
    description: Cost events, analytics, budgets, and model pricing
  - name: Gateway
    description: Provider, route, fallback, and cache management
  - name: Prompts
    description: Prompt management and versioning
  - name: Playground
    description: Prompt playground execution
  - name: Datasets
    description: Dataset management and items
  - name: Webhooks
    description: Webhook endpoint management and deliveries
  - name: OTLP
    description: OpenTelemetry trace ingestion
  - name: Settings
    description: Organization, API keys, team, SSO, and audit logs

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from OAuth login or API key (tf_sk_...)

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
      description: Page number
    PerPageParam:
      name: per_page
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
      description: Items per page
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 1000 }
      description: Maximum number of items to return
    OffsetParam:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
      description: Number of items to skip
    StartParam:
      name: start
      in: query
      schema: { type: string, format: date-time }
      description: Start of time range (RFC3339)
    EndParam:
      name: end
      in: query
      schema: { type: string, format: date-time }
      description: End of time range (RFC3339)
    IntervalParam:
      name: interval
      in: query
      schema: { type: integer, default: 3600 }
      description: Interval in seconds for time-series bucketing
    FromParam:
      name: from
      in: query
      schema: { type: string, format: date-time }
      description: Start of date range (RFC3339), defaults to 30 days ago
    ToParam:
      name: to
      in: query
      schema: { type: string, format: date-time }
      description: End of date range (RFC3339), defaults to now
    IDParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Resource UUID

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: name is required

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        agent_name: { type: string }
        agent_id: { type: string }
        status:
          type: string
          enum: [completed, failed, running, timeout, healed]
        total_tokens: { type: integer }
        total_cost_cents: { type: integer }
        duration_ms: { type: integer }
        span_count: { type: integer }
        error_message: { type: string }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }

    Span:
      type: object
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        parent_span_id: { type: string, format: uuid }
        span_type:
          type: string
          enum: [llm_call, tool_call, retrieval, chain, agent, custom]
        name: { type: string }
        model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        duration_ms: { type: integer }
        status: { type: string }
        error: { type: string }
        metadata: { type: object }
        created_at: { type: string, format: date-time }

    HealingEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        healing_type:
          type: string
          enum: [loop_breaker, hallucination_fix, cost_circuit_breaker, timeout_handler, error_recovery, custom]
        trigger: { type: string }
        action_taken: { type: string }
        original_state: { type: object }
        healed_state: { type: object }
        metadata: { type: object }
        created_at: { type: string, format: date-time }

    Agent:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        framework: { type: string }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Pattern:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        pattern: { type: string }
        severity: { type: string }
        category: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AlertRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        condition: { type: object }
        threshold: { type: number }
        window_seconds: { type: integer }
        channels: { type: array, items: { type: string } }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TestSuite:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        agent_id: { type: string, format: uuid }
        tags: { type: array, items: { type: string } }
        case_count: { type: integer }
        last_run_status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TestCase:
      type: object
      properties:
        id: { type: string, format: uuid }
        suite_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        input: { type: object }
        expected_output: { type: object }
        evaluator_ids: { type: array, items: { type: string } }
        metadata: { type: object }
        created_at: { type: string, format: date-time }

    TestRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        suite_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, running, completed, failed]
        total_cases: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        score: { type: number }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    Evaluator:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string }
        config: { type: object }
        is_builtin: { type: boolean }
        created_at: { type: string, format: date-time }

    GuardRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [pii, toxicity, injection, hallucination, topic, code_exec, length, custom]
        mode:
          type: string
          enum: [block, warn, log]
        apply_to:
          type: string
          enum: [input, output, both]
        config: { type: object }
        enabled: { type: boolean }
        priority: { type: integer }
        is_builtin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GuardCheckRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: Text content to check against guardrails
        direction:
          type: string
          enum: [input, output]
          default: input
        guardrail_ids:
          type: array
          items: { type: string }
          description: Specific guardrail IDs to run (omit for all active)
        session_id:
          type: string
          description: Optional session ID for event correlation

    GuardCheckResponse:
      type: object
      properties:
        action:
          type: string
          enum: [allow, block, warn]
        results:
          type: array
          items:
            type: object
            properties:
              guardrail_id: { type: string }
              name: { type: string }
              type: { type: string }
              action: { type: string }
              findings: { type: array, items: { type: string } }
              latency_ms: { type: number }

    GuardEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        guardrail_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        action: { type: string }
        guard_type: { type: string }
        input_text: { type: string }
        findings: { type: array, items: { type: string } }
        latency_ms: { type: integer }
        created_at: { type: string, format: date-time }

    CostEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        session_id: { type: string }
        span_id: { type: string }
        agent_name: { type: string }
        model: { type: string }
        provider: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        cost_cents: { type: integer }
        outcome: { type: string }
        metadata: { type: object }
        created_at: { type: string, format: date-time }

    Budget:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        scope:
          type: string
          enum: [org, agent, model]
        scope_value: { type: string }
        limit_cents: { type: integer }
        current_spend_cents: { type: integer }
        period:
          type: string
          enum: [daily, weekly, monthly]
        action:
          type: string
          enum: [alert, throttle, block]
        alert_threshold_pct: { type: integer }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ModelPricing:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        model: { type: string }
        input_cost_per_1m: { type: integer, description: Cost in cents per 1M input tokens }
        output_cost_per_1m: { type: integer, description: Cost in cents per 1M output tokens }
        updated_at: { type: string, format: date-time }

    Provider:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: string }
        base_url: { type: string }
        is_enabled: { type: boolean }
        config: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Route:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        model_pattern: { type: string }
        strategy:
          type: string
          enum: [priority, round_robin, weighted, cost_optimized]
        provider_id: { type: string, format: uuid }
        target_model: { type: string }
        priority: { type: integer }
        weight: { type: number }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FallbackChain:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              provider_id: { type: string }
              model: { type: string }
              timeout_ms: { type: integer }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Prompt:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        body: { type: string }
        model: { type: string }
        system_prompt: { type: string }
        variables: { type: object }
        config: { type: object }
        tags: { type: array, items: { type: string } }
        metadata: { type: object }
        active_version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PromptVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        prompt_id: { type: string, format: uuid }
        version: { type: integer }
        body: { type: string }
        model: { type: string }
        system_prompt: { type: string }
        variables: { type: object }
        config: { type: object }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    Dataset:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        schema: { type: object }
        tags: { type: array, items: { type: string } }
        source: { type: string }
        item_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DatasetItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        dataset_id: { type: string, format: uuid }
        data: { type: object }
        metadata: { type: object }
        created_at: { type: string, format: date-time }

    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        type:
          type: string
          enum: [generic, slack, pagerduty]
        url: { type: string, format: uri }
        events:
          type: array
          items:
            type: string
            enum:
              - alert.fired
              - alert.resolved
              - shield.healing
              - shield.circuit_break
              - guard.blocked
              - guard.flagged
              - cost.budget_warning
              - cost.budget_exceeded
              - test.run_completed
              - test.run_failed
              - session.failed
        headers: { type: object }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid }
        event_type: { type: string }
        payload: { type: object }
        status_code: { type: integer }
        response_body: { type: string }
        success: { type: boolean }
        attempt: { type: integer }
        created_at: { type: string, format: date-time }

    SamplingConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        agent_name: { type: string }
        sample_rate: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        details: { type: object }
        ip_address: { type: string }
        created_at: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  # ==================== System ====================
  /health:
    get:
      summary: Health check
      tags: [System]
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }
                  version: { type: string, example: 0.1.0 }
                  time: { type: string, format: date-time }

  /ready:
    get:
      summary: Readiness check
      description: Checks connectivity to PostgreSQL, Redis, and NATS
      tags: [System]
      security: []
      responses:
        '200':
          description: All dependencies healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
                  checks:
                    type: object
                    properties:
                      postgres: { type: string }
                      redis: { type: string }
                      nats: { type: string }
        '503':
          description: One or more dependencies unhealthy

  # ==================== Auth ====================
  /auth/github:
    post:
      summary: Initiate GitHub OAuth login
      tags: [Auth]
      security: []
      responses:
        '200':
          description: OAuth authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        '501':
          description: GitHub OAuth not configured

  /auth/github/callback:
    get:
      summary: GitHub OAuth callback
      tags: [Auth]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
          description: Authorization code from GitHub
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      name: { type: string }
                      avatar_url: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/sso/lookup:
    get:
      summary: Look up SSO configuration for an org
      tags: [Auth]
      security: []
      parameters:
        - name: email
          in: query
          schema: { type: string }
        - name: domain
          in: query
          schema: { type: string }
      responses:
        '200':
          description: SSO configuration found

  /auth/saml/acs:
    post:
      summary: SAML Assertion Consumer Service endpoint
      tags: [Auth]
      security: []
      responses:
        '200':
          description: SAML authentication processed

  /auth/oidc/{orgID}/login:
    get:
      summary: Initiate OIDC login for an organization
      tags: [Auth]
      security: []
      parameters:
        - name: orgID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '302':
          description: Redirect to OIDC provider

  /auth/oidc/callback:
    get:
      summary: OIDC callback
      tags: [Auth]
      security: []
      responses:
        '302':
          description: Redirect to frontend with auth token

  # ==================== Ingestion ====================
  /v1/ingest/sessions:
    post:
      summary: Ingest a session
      description: Accepts a session for async ingestion via NATS
      tags: [Ingestion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_name]
              properties:
                id: { type: string, format: uuid }
                agent_name: { type: string }
                agent_id: { type: string }
                status: { type: string, enum: [completed, failed, running, timeout, healed] }
                total_tokens: { type: integer }
                total_cost_cents: { type: integer }
                duration_ms: { type: integer }
                error_message: { type: string }
                metadata: { type: object }
      responses:
        '202':
          description: Session accepted for ingestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: accepted }
                  session_id: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/ingest/spans:
    post:
      summary: Ingest spans
      description: Accepts an array of spans for async ingestion
      tags: [Ingestion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [session_id, span_type]
                properties:
                  id: { type: string, format: uuid }
                  session_id: { type: string, format: uuid }
                  parent_span_id: { type: string }
                  span_type: { type: string, enum: [llm_call, tool_call, retrieval, chain, agent, custom] }
                  name: { type: string }
                  model: { type: string }
                  input: { type: object }
                  output: { type: object }
                  input_tokens: { type: integer }
                  output_tokens: { type: integer }
                  duration_ms: { type: integer }
                  status: { type: string }
                  error: { type: string }
                  metadata: { type: object }
      responses:
        '202':
          description: Spans accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: accepted }
                  count: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/ingest/events:
    post:
      summary: Ingest events
      description: Accepts an array of session events for async ingestion
      tags: [Ingestion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [session_id]
                properties:
                  session_id: { type: string, format: uuid }
                  type: { type: string }
                  data: { type: object }
                  timestamp: { type: string, format: date-time }
      responses:
        '202':
          description: Events accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: accepted }
                  count: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/ingest/batch:
    post:
      summary: Batch ingest sessions, spans, and events
      description: Accepts a batch of sessions, spans, and events in one request. Returns adaptive sample rate header.
      tags: [Ingestion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessions:
                  type: array
                  items: { type: object }
                spans:
                  type: array
                  items: { type: object }
                events:
                  type: array
                  items: { type: object }
      responses:
        '202':
          description: Batch accepted
          headers:
            X-Traceform-Sample-Rate:
              schema: { type: string }
              description: Adaptive sample rate for SDK-side sampling
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: accepted }
                  sessions: { type: integer }
                  spans: { type: integer }
                  events: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/ingest/healing:
    post:
      summary: Ingest healing events
      description: Accepts an array of Shield healing events for async ingestion
      tags: [Shield]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [session_id, healing_type]
                properties:
                  session_id: { type: string, format: uuid }
                  healing_type:
                    type: string
                    enum: [loop_breaker, hallucination_fix, cost_circuit_breaker, timeout_handler, error_recovery, custom]
                  trigger: { type: string }
                  action_taken: { type: string }
                  original_state: { type: object }
                  healed_state: { type: object }
                  metadata: { type: object }
      responses:
        '202':
          description: Healing events accepted
