                  limit: { type: integer }
                  offset: { type: integer }
    post:
      summary: Record cost event(s)
      description: Supports single event or batch via `events` array. Requires admin role.
      tags: [Cost]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { type: string }
                span_id: { type: string }
                agent_name: { type: string }
                model: { type: string, description: Required for single event }
                provider: { type: string, description: Required for single event }
                input_tokens: { type: integer }
                output_tokens: { type: integer }
                total_tokens: { type: integer }
                cost_cents: { type: integer }
                outcome: { type: string }
                metadata: { type: object }
                events:
                  type: array
                  items:
                    type: object
                    required: [model, provider]
                    properties:
                      session_id: { type: string }
                      span_id: { type: string }
                      agent_name: { type: string }
                      model: { type: string }
                      provider: { type: string }
                      input_tokens: { type: integer }
                      output_tokens: { type: integer }
                      total_tokens: { type: integer }
                      cost_cents: { type: integer }
                      outcome: { type: string }
                  description: Batch events (max 1000)
      responses:
        '201':
          description: Cost event(s) recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostEvent' }
