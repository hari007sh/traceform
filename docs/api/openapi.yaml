      description: Requires admin role
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                schema: { type: object }
                tags: { type: array, items: { type: string } }
      responses:
        '200':
          description: Dataset updated
    delete:
      summary: Delete dataset
      tags: [Datasets]
      description: Requires admin role
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '204':
          description: Dataset deleted

  /v1/datasets/{id}/items:
    get:
      summary: List dataset items
      tags: [Datasets]
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: List of dataset items
    post:
      summary: Create dataset item
      tags: [Datasets]
      description: Requires admin role
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: object }
                metadata: { type: object }
      responses:
        '201':
          description: Item created

  /v1/datasets/{id}/items/batch:
    post:
      summary: Batch create dataset items
      tags: [Datasets]
      description: Requires admin role
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      data: { type: object }
                      metadata: { type: object }
      responses:
        '201':
          description: Items created

  /v1/datasets/{id}/items/{itemID}:
    get:
      summary: Get dataset item
      tags: [Datasets]
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - name: itemID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Item detail
    delete:
      summary: Delete dataset item
      tags: [Datasets]
      description: Requires admin role
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - name: itemID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Item deleted

  /v1/datasets/{id}/export:
    get:
      summary: Export dataset
      tags: [Datasets]
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Exported dataset data

  /v1/datasets/{id}/import:
    post:
      summary: Import data into dataset
      tags: [Datasets]
      description: Requires admin role
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Data imported

  /v1/datasets/{id}/link/{suiteID}:
    post:
      summary: Link dataset to test suite
      tags: [Datasets]
      description: Requires admin role
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - name: suiteID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Link created
        '409':
          description: Already linked
    delete:
      summary: Unlink dataset from test suite
      tags: [Datasets]
      description: Requires admin role
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - name: suiteID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Link removed

  /v1/datasets/from-session/{sessionID}:
    post:
      summary: Create dataset item from session
      tags: [Datasets]
      description: Captures a production session as a dataset item. Requires admin role.
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id]
              properties:
                dataset_id: { type: string, format: uuid }
                include_input: { type: boolean }
                include_output: { type: boolean }
                include_context: { type: boolean }
                label: { type: string }
      responses:
        '201':
          description: Dataset item created from session

  # ==================== OTLP ====================
  /v1/otlp/v1/traces:
    post:
      summary: Receive OpenTelemetry traces
      description: OTLP/HTTP receiver for ingesting OpenTelemetry trace data
      tags: [OTLP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: OTLP ExportTraceServiceRequest
          application/x-protobuf:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Traces accepted
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==================== Webhooks ====================
  /v1/webhooks:
    get:
      summary: List webhooks
      tags: [Webhooks]
      responses:
        '200':
          description: List of webhook endpoints (secrets masked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Webhook' }
    post:
      summary: Create webhook
      tags: [Webhooks]
      description: Requires admin role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, events]
              properties:
                name: { type: string }
                type: { type: string, enum: [generic, slack, pagerduty], default: generic }
                url: { type: string, format: uri }
                secret: { type: string }
                events:
                  type: array
                  items:
                    type: string
                    enum:
                      - alert.fired
                      - alert.resolved
                      - shield.healing
                      - shield.circuit_break
                      - guard.blocked
                      - guard.flagged
                      - cost.budget_warning
                      - cost.budget_exceeded
                      - test.run_completed
                      - test.run_failed
                      - session.failed
                headers: { type: object }
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Webhook' }

  /v1/webhooks/{id}:
    get:
      summary: Get webhook
      tags: [Webhooks]
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Webhook detail (secret masked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Webhook' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update webhook
      tags: [Webhooks]
      description: Requires admin role
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string }
                url: { type: string }
                secret: { type: string }
                events: { type: array, items: { type: string } }
                headers: { type: object }
                is_active: { type: boolean }
      responses:
        '200':
          description: Webhook updated
    delete:
      summary: Delete webhook
      tags: [Webhooks]
      description: Requires admin role
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '204':
          description: Webhook deleted

  /v1/webhooks/{id}/test:
    post:
      summary: Send test webhook delivery
      tags: [Webhooks]
      description: Requires admin role
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Test delivery result

  /v1/webhooks/{id}/deliveries:
    get:
      summary: List webhook deliveries
      tags: [Webhooks]
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: List of deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }

  /v1/webhooks/{id}/deliveries/{deliveryID}/retry:
    post:
      summary: Retry webhook delivery
      tags: [Webhooks]
      description: Requires admin role
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - name: deliveryID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Delivery retried

