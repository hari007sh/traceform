apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentstack.fullname" . }}-web
  labels:
    {{- include "agentstack.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "agentstack.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "agentstack.componentLabels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- include "agentstack.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "agentstack.image" (dict "root" . "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.port }}
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ printf "https://%s" (index .Values.ingress.hosts 0).host | quote }}
            - name: PORT
              value: {{ .Values.web.service.port | quote }}
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
