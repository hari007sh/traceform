apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentstack.configMapName" . }}
  labels:
    {{- include "agentstack.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.server.env.ENVIRONMENT | default "production" | quote }}
  PORT: {{ .Values.server.service.port | quote }}
  GATEWAY_PORT: {{ .Values.gateway.service.port | quote }}
  CLICKHOUSE_URL: {{ include "agentstack.clickhouseURL" . | quote }}
  REDIS_URL: {{ include "agentstack.redisURL" . | quote }}
  NATS_URL: {{ include "agentstack.natsURL" . | quote }}
  FRONTEND_URL: {{ printf "https://%s" (index .Values.ingress.hosts 0).host | quote }}
  POSTGRESQL_HOST: {{ .Values.postgresql.host | quote }}
  POSTGRESQL_PORT: {{ .Values.postgresql.port | quote }}
  POSTGRESQL_DATABASE: {{ .Values.postgresql.database | quote }}
  POSTGRESQL_USERNAME: {{ .Values.postgresql.username | quote }}
