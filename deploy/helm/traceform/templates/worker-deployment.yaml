apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traceform.fullname" . }}-worker
  labels:
    {{- include "traceform.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "traceform.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "traceform.componentLabels" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      {{- include "traceform.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "traceform.image" (dict "root" . "image" .Values.worker.image) }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["/worker"]
          envFrom:
            - configMapRef:
                name: {{ include "traceform.configMapName" . }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.secretKey }}
            - name: DATABASE_URL
              value: {{ include "traceform.databaseURL" . | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "traceform.secretName" . }}
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
