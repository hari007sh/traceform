---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "traceform.fullname" . }}-server
  labels:
    {{- include "traceform.componentLabels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "traceform.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
