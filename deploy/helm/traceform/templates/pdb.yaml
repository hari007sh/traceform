  labels:
    {{- include "traceform.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "traceform.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
