apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traceform.fullname" . }}-gateway
  labels:
    {{- include "traceform.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "traceform.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "traceform.componentLabels" (dict "root" . "component" "gateway") | nindent 8 }}
    spec:
      {{- include "traceform.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: gateway
          image: {{ include "traceform.image" (dict "root" . "image" .Values.gateway.image) }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command: ["/gateway"]
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "traceform.configMapName" . }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.secretKey }}
            - name: DATABASE_URL
              value: {{ include "traceform.databaseURL" . | quote }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "traceform.secretName" . }}
                  key: ENCRYPTION_KEY
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
