apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "traceform.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "traceform.componentLabels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "traceform.componentLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      {{- include "traceform.imagePullSecrets" . | nindent 6 }}
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "traceform.image" (dict "root" . "image" .Values.migrate.image) }}
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          command: ["/migrate", "-direction", "up", "-seed"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.secretKey }}
            - name: DATABASE_URL
              value: {{ include "traceform.databaseURL" . | quote }}
            - name: CLICKHOUSE_URL
              value: {{ include "traceform.clickhouseURL" . | quote }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
