# =============================================================================
# Traceform — Caddy TLS Reverse Proxy (Docker Compose)
# =============================================================================
#
# Run alongside the main docker-compose.yml to add TLS termination:
#
#   docker compose -f docker-compose.yml -f deploy/caddy/docker-compose.caddy.yml up -d
#
# Caddy handles:
#   - Automatic Let's Encrypt certificates in production
#   - Self-signed certificates for local development
#   - HTTP-to-HTTPS redirect
#   - Security headers
#   - Gzip/zstd compression
#
# Volumes:
#   caddy_data   — persists certificates across restarts
#   caddy_config — persists Caddy runtime configuration

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
